name: web-kelompok3
services:
  caddy:
    image: caddy:latest
    ports:
      - "${APP_PORT:-8083}:80"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    volumes:
      - ../public:/srv
      - caddy_data:/data
      - caddy_config:/config

configs:
  caddy_config:
    content: |
      :80 {
          root * /srv
          file_server
      }

volumes:
  caddy_data:
  caddy_config:
